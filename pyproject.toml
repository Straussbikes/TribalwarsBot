[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tribalwars-engine"
version = "1.2.0"
description = "Autonomous, lightweight, fingerprint-evading automation engine for Tribal Wars (mobile version)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.16.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
